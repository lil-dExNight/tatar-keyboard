// Error Prone as a build-time javac plugin for the legacy Java sources. Nothing
// reaches the APK. error_prone_core 2.42.0 is the last release that runs on
// JDK 17 (2.43.0 requires JDK 21), which is what the local toolchain and CI use.
plugins {
    id 'net.ltgt.errorprone' version '4.3.0'
}
apply plugin: 'com.android.application'
// Packages the profile generated by :baselineprofile as assets/dexopt/baseline.prof.
// No runtime dependency (no profileinstaller).
apply plugin: 'androidx.baselineprofile'

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    compileSdk 37
    defaultConfig {
        applicationId "org.tatarkeyboard.ime"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 44
        versionName "3.7.0"
        // The app ships three locales only: Tatar, Russian, English.
        resConfigs "tt", "ru", "en"
        // Instrumentation tests (androidTest only). The legacy platform runner needs no external
        // dependency, so it resolves offline; androidTest never contributes to the release APK.
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // -PskipReleaseSigning produces an unsigned APK even when keystore.properties
            // exists: scripts/release_pack.sh builds unsigned, then runs zipalign -z
            // (zopfli, must run before signing) and apksigner sign.
            if (keystorePropsFile.exists() && !project.hasProperty('skipReleaseSigning')) {
                signingConfig signingConfigs.release
            }
        }
    }
    namespace 'rkr.simplekeyboard.inputmethod'
    // Reproducible build: AGP signs the Dependency Info Block with an ephemeral
    // per-build key, so two builds of the same tree differ inside the APK Signing
    // Block. The block only carries dependency metadata for Play. Keep it disabled.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    packagingOptions {
        // kotlin-stdlib metadata for the compiler's built-ins; unused at runtime
        // because the app has no kotlin-reflect.
        resources.excludes += '**/*.kotlin_builtins'
    }
    lint {
        // Existing findings are baselined; any new lint error fails the build.
        baseline = file("lint-baseline.xml")
        abortOnError true
    }
}

// Error Prone findings stay warnings (allErrorsAsWarnings): the legacy Java sources
// predate the tool, and ERROR-severity checks would otherwise abort compilation.
// Under AGP the net.ltgt.errorprone plugin is inert by design: it neither wires Error
// Prone into AGP's compile tasks nor enables itself. The wiring goes through the
// annotationProcessor configurations (see dependencies below); setting
// options.annotationProcessorPath directly does not work because AGP overwrites it
// and passes -proc:none. Only the per-task enablement lives here.
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        enabled = true
        allErrorsAsWarnings = true
        compilingTestOnlyCode = name.toLowerCase().contains('test')
    }
}

// Two JVM test forks where there are at least 8 CPUs, one elsewhere: the calibration suites take
// most of the run, and host timing asserts must not compete with a second fork on small CI
// runners. Each fork is its own JVM and the tests use their own temporary files.
tasks.withType(Test).configureEach {
    maxParallelForks = Math.max(1, Math.min(2, Runtime.runtime.availableProcessors().intdiv(4)))
}

dependencies {
    // Build-time only. error_prone_core on the annotationProcessor configurations puts
    // it on the javac processor path (which also lifts AGP's -proc:none);
    // net.ltgt.errorprone then activates it with -Xplugin:ErrorProne.
    def errorProneCore = 'com.google.errorprone:error_prone_core:2.42.0'
    annotationProcessor errorProneCore
    testAnnotationProcessor errorProneCore
    androidTestAnnotationProcessor errorProneCore
    // The app has no runtime dependencies. ExploreByTouchHelper is forked into
    // rkr.simplekeyboard.inputmethod.compat instead of depending on AndroidX.

    // Pulls the generated baseline-prof.txt into the build; adds no code to the APK.
    baselineProfile project(':baselineprofile')
    testImplementation 'junit:junit:4.13.2'

    // Instrumentation tests compile against the SDK's legacy instrumentation classes, so nothing is
    // downloaded and nothing is packaged. On the device the classes come from the platform's
    // android.test.runner / android.test.base shared libraries.
    def optionalDir = new File(android.sdkDirectory, "platforms").listFiles()
            ?.findAll { it.name.startsWith("android-${android.compileSdk}") }
            ?.collect { new File(it, "optional") }
            ?.find { it.isDirectory() }
    if (optionalDir != null) {
        androidTestCompileOnly files(new File(optionalDir, "android.test.runner.jar"),
                new File(optionalDir, "android.test.base.jar"))
    }
}
