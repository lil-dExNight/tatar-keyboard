// DEV-4: error-prone as a build-time javac plugin for the legacy Java sources.
// Build-time only: the artifacts land in the `errorprone` configuration and never
// reach the APK (zero runtime dependencies). Version pins: error_prone_core 2.42.0
// is the last release that RUNS on JDK 17 (2.43.0 raised the minimum to JDK 21),
// matching both the local toolchain and CI (temurin 17).
plugins {
    id 'net.ltgt.errorprone' version '4.3.0'
}
apply plugin: 'com.android.application'
// Phase 4b: consumes the profile generated by :baselineprofile and packages it as
// assets/dexopt/baseline.prof. No runtime dependency (no profileinstaller).
apply plugin: 'androidx.baselineprofile'

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    compileSdk 37
    defaultConfig {
        applicationId "org.tatarkeyboard.ime"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 29
        versionName "1.9.13"
        // Phase 3b: the app ships three locales only — Tatar, Russian, English. Also strips
        // the dozens of translations pulled in by androidx.customview.
        resConfigs "tt", "ru", "en"
        // E3b instrumental harness (androidTest only). The legacy platform runner needs no external
        // dependency, so it resolves offline; androidTest never contributes to the release APK.
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // SIZE-3: -PskipReleaseSigning produces an unsigned APK even when
            // keystore.properties exists — scripts/release_pack.sh builds unsigned,
            // then zipalign -z (zopfli, must run BEFORE signing) + apksigner sign.
            if (keystorePropsFile.exists() && !project.hasProperty('skipReleaseSigning')) {
                signingConfig signingConfigs.release
            }
        }
    }
    namespace 'rkr.simplekeyboard.inputmethod'
    // DEV-2: reproducible build (F-Droid). The Dependency Info Block (signing-block
    // id 0x504b4453) is signed by AGP with an ephemeral per-build key, so two builds
    // of the same tree differed byte-wise inside the APK Signing Block even though
    // all 244 zip entries and the v2 signature were identical. The block carries
    // dependency metadata for Play and serves no purpose here — drop it.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    packagingOptions {
        // Phase 4a: kotlin-stdlib metadata for the compiler's built-ins; unused at runtime
        // (no kotlin-reflect in the app), ~42 KB inside the APK otherwise.
        resources.excludes += '**/*.kotlin_builtins'
    }
    lint {
        // Phase 4a: pre-existing findings are baselined; any NEW lint error fails the build.
        baseline = file("lint-baseline.xml")
        abortOnError true
    }
}

// DEV-4: error-prone findings stay warnings (allErrorsAsWarnings) — the ~80 legacy
// Java files predate the tool; findings are reviewed deliberately instead of failing
// the build on inherited noise. Default-severity ERROR checks would otherwise abort
// compilation.
// With AGP the net.ltgt.errorprone plugin stays inert by design (README, "Android
// Gradle Plugin support"): it neither wires Error Prone into AGP's compile tasks nor
// enables itself. Wiring here goes through the variant annotationProcessor
// configurations (see dependencies below) — setting options.annotationProcessorPath
// directly does NOT work: AGP overwrites it and passes -proc:none. Only the
// per-task enablement lives here.
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        enabled = true
        allErrorsAsWarnings = true
        compilingTestOnlyCode = name.toLowerCase().contains('test')
    }
}

dependencies {
    // DEV-4: build-time only (see plugins block above). error_prone_core on the
    // annotationProcessor configurations puts it on the javac processor path (which
    // also lifts AGP's -proc:none); net.ltgt.errorprone then activates it as a javac
    // plugin (-Xplugin:ErrorProne). Nothing of this is packaged into the APK.
    def errorProneCore = 'com.google.errorprone:error_prone_core:2.42.0'
    annotationProcessor errorProneCore
    testAnnotationProcessor errorProneCore
    androidTestAnnotationProcessor errorProneCore
    implementation 'androidx.customview:customview:1.1.0'
    // Phase 4b: wiring only — pulls the generated baseline-prof.txt into the build.
    // Dev-only: contributes no code or dependency to the APK.
    baselineProfile project(':baselineprofile')
    testImplementation 'junit:junit:4.13.2'

    // E3b instrumental harness: compile-only against the SDK's legacy instrumentation classes so no
    // external artifact is downloaded (offline) and nothing is packaged into the release APK. The
    // classes are provided by the platform's android.test.runner / android.test.base shared
    // libraries at runtime on the device.
    def optionalDir = new File(android.sdkDirectory, "platforms").listFiles()
            ?.findAll { it.name.startsWith("android-${android.compileSdk}") }
            ?.collect { new File(it, "optional") }
            ?.find { it.isDirectory() }
    if (optionalDir != null) {
        androidTestCompileOnly files(new File(optionalDir, "android.test.runner.jar"),
                new File(optionalDir, "android.test.base.jar"))
    }
}
