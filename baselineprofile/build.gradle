// Baseline Profile generator module (dev-only).
// Runs BaselineProfileRule against :app on a connected emulator and writes the baseline and
// startup profiles to app/src/main/generated/baselineProfiles/ (mergeIntoMain in
// app/build.gradle), which AGP reads for every variant.
// Nothing from this module is compiled into or packaged with the app.
plugins {
    id 'com.android.test'
    id 'androidx.baselineprofile'
}

android {
    namespace 'org.tatarkeyboard.baselineprofile'
    compileSdk 37
    defaultConfig {
        // minSdk of the *test* APK; generation runs on the API 34 emulator.
        minSdkVersion 28
        targetSdkVersion 37
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    // Point to the app module, the module that we're generating the Baseline Profile for.
    targetProjectPath ':app'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

baselineProfile {
    // A booted AVD (API 34) instead of a Gradle-managed device: no system-image download,
    // and the profile is recorded on the same AVD used for cold-start measurements.
    useConnectedDevices = true
}

// useConnectedDevices picks one attached device nondeterministically, so run generation
// with only the emulator attached or pin it explicitly:
//     ANDROID_SERIAL=<emulator-serial> ./gradlew :app:generateBaselineProfile
// The generator also fails fast on a device that does not look like an emulator
// (ro.kernel.qemu=1 or a generic/sdk/emulator fingerprint); the only override is the
// instrumentation argument `-e ttAllowPhysicalDevice true`.

dependencies {
    // TraceSectionMetric assertions need 1.5.0 or newer.
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.5.0'
    implementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    implementation 'androidx.test.ext:junit:1.2.1'
}
