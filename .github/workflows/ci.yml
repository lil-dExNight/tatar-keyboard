name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

# Every action is pinned to a full-length commit SHA, with its tag in the trailing comment.
# A floating tag follows wherever upstream moves it, so a compromised action repository would
# reach this pipeline silently. To update an action, resolve the new tag's commit (dereference
# annotated tags) and change the pin together with its comment.

jobs:
  # gradle/verification-metadata.xml enforces PGP signatures, with SHA-256 as the fallback for
  # unsigned artifacts. The public keys are committed (gradle/verification-keyring.gpg and
  # .keys), so CI never contacts a keyserver. This cold-cache job checks them on every push.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Fast-fail: level 1 (source manifest) runs before any toolchain setup;
      # without an APK the script skips level 2 and still exits non-zero on INTERNET.
      - name: Check no INTERNET permission (source manifest)
        run: bash scripts/check-no-internet.sh

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # gradle-wrapper.jar is intentionally not tracked (upstream gitignores gradle/);
      # restore it from the official distribution, pinned by sha256.
      - name: Restore gradle-wrapper.jar
        run: |
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v9.6.0/gradle/wrapper/gradle-wrapper.jar
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Run JVM unit tests
        run: ./gradlew test calibrationTest --console=plain

      # Build-time Python packers: plain unittest, no pytest.
      # Pinned to 3.12 so 3.13+ APIs fail here, not on contributors' machines.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run python packer tests
        run: bash scripts/run_python_tests.sh

      # Writing rules for comments and Markdown; exceptions in scripts/text_hygiene_allowlist.txt.
      - name: Check text hygiene
        run: python3 scripts/text_hygiene_check.py

      # Existing findings live in app/lint-baseline.xml; any new lint error breaks the build.
      - name: Run release lint
        run: ./gradlew lintRelease --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # keystore.properties is gitignored, so assembleRelease produces an unsigned APK
      # (see signingConfig in app/build.gradle). The gates below check size, permissions
      # and backup rules, not the signature; the signature is verified locally with apksigner.
      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease

      # Hard budget: 3 MiB = 3145728 bytes, byte-exact via stat.
      - name: Check release APK size (≤ 3 MiB)
        run: test $(stat -c%s app/build/outputs/apk/release/app-release-unsigned.apk) -le 3145728

      # The release checks that need no keystore: the exported components against the golden
      # set, and no keystore, private key or token in the tracked tree or the APK.
      - name: Check exported surface and secrets (release APK)
        run: bash scripts/release_check.sh --checks exported_surface,no_secrets app/build/outputs/apk/release/app-release-unsigned.apk

      # Both levels: source manifest + aapt2 dump permissions on the built APK. Checked on
      # debug and release, since the release merged manifest could differ if a
      # buildType-specific library or manifest overlay were ever added.
      - name: Check no INTERNET permission (debug APK)
        run: bash scripts/check-no-internet.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Check no INTERNET permission (release APK)
        run: bash scripts/check-no-internet.sh app/build/outputs/apk/release/app-release-unsigned.apk

      # No artifacts from pull_request runs: a fork PR builds code of the author's choosing,
      # so its APK is untrusted. Push runs (trusted tree) upload the debug APK.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # Reproducible build: two clean rebuilds of the same tree must produce byte-identical APKs.
  # CI has no keystore.properties, so both APKs are unsigned and compared whole. Locally the
  # signed APK is reproducible too, because the Dependency Info Block is disabled in
  # app/build.gradle.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore gradle-wrapper.jar
        run: |
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v9.6.0/gradle/wrapper/gradle-wrapper.jar
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Build release APK (run 1)
        run: ./gradlew clean assembleRelease --no-build-cache
      - name: Stash APK 1
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/repro-1.apk
      - name: Build release APK (run 2)
        run: ./gradlew clean assembleRelease --no-build-cache
      - name: Compare SHA-256
        run: |
          sha256sum /tmp/repro-1.apk app/build/outputs/apk/release/app-release-unsigned.apk
          cmp /tmp/repro-1.apk app/build/outputs/apk/release/app-release-unsigned.apk

      # The release_pack.sh packing (zopfli zipalign) must be deterministic too:
      # pack the run-2 APK twice with --no-sign (CI has no keystore) and compare, so the job
      # proves pack determinism from identical bytes without a third and fourth clean build.
      # The runner image does not carry the build-tools version pinned in
      # scripts/build-tools-pin.sh, so this job uses the runner's newest build-tools via
      # TT_BUILD_TOOLS_VERSION. Local releases use the pin.
      - name: Pack twice without signing
        env:
          TT_BUILD_TOOLS_VERSION: ''
        run: |
          set -e
          latest=$(ls -1 "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          echo "runner build-tools: $latest"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          TT_BUILD_TOOLS_VERSION="$latest" bash scripts/release_pack.sh --no-sign --from-apk "$UNSIGNED" /tmp/pack-1.apk
          TT_BUILD_TOOLS_VERSION="$latest" bash scripts/release_pack.sh --no-sign --from-apk "$UNSIGNED" /tmp/pack-2.apk
          sha256sum /tmp/pack-1.apk /tmp/pack-2.apk
          cmp /tmp/pack-1.apk /tmp/pack-2.apk
