name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fast-fail: level 1 (source manifest) runs before any toolchain setup;
      # without an APK the script skips level 2 and still exits non-zero on INTERNET.
      - name: Check no INTERNET permission (source manifest)
        run: bash scripts/check-no-internet.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # gradle-wrapper.jar is intentionally not tracked (upstream gitignores gradle/);
      # restore it from the official distribution, pinned by sha256.
      - name: Restore gradle-wrapper.jar
        run: |
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v9.6.0/gradle/wrapper/gradle-wrapper.jar
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Run JVM unit tests
        run: ./gradlew test --console=plain

      # Build-time python packers: plain unittest, no pytest (Phase 4a).
      # Pinned to 3.12 so 3.13+ APIs fail here, not on contributors' machines.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run python packer tests
        run: for f in tests/*/test_*.py; do python3 "$f" || exit 1; done

      # Full release lint with baseline (Phase 4a): pre-existing findings live in
      # app/lint-baseline.xml, any NEW lint error breaks the build.
      - name: Run release lint
        run: ./gradlew lintRelease --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # keystore.properties is gitignored, so signingConfig is skipped by design
      # (app/build.gradle) and assembleRelease produces an unsigned APK. That is
      # correct for CI: the gates below check size and resources, not the signature
      # (the signature is verified locally with apksigner).
      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease

      # PERF-01: hard budget 3 MB = 3145728 bytes (1024*1024*3), byte-exact via stat.
      - name: Check release APK size (PERF-01 ≤ 3 MB)
        run: test $(stat -c%s app/build/outputs/apk/release/app-release-unsigned.apk) -le 3145728

      # PERF-04, both levels: source manifest + aapt2 dump permissions on the built APK.
      # Run against both debug and release; release uses the merged manifest and may differ
      # if a buildType-specific library or manifest overlay were ever added.
      - name: Check no INTERNET permission (debug APK)
        run: bash scripts/check-no-internet.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Check no INTERNET permission (release APK)
        run: bash scripts/check-no-internet.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # DEV-2: reproducible build gate. Two full clean rebuilds of the same tree must
  # produce byte-identical APKs. CI has no keystore.properties, so both APKs are
  # unsigned and compared whole (locally the signed APK is reproducible too after
  # the Dependency Info Block was dropped — see app/build.gradle).
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore gradle-wrapper.jar
        run: |
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v9.6.0/gradle/wrapper/gradle-wrapper.jar
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Build release APK (run 1)
        run: ./gradlew clean assembleRelease --no-build-cache
      - name: Stash APK 1
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/repro-1.apk
      - name: Build release APK (run 2)
        run: ./gradlew clean assembleRelease --no-build-cache
      - name: Compare SHA-256
        run: |
          sha256sum /tmp/repro-1.apk app/build/outputs/apk/release/app-release-unsigned.apk
          cmp /tmp/repro-1.apk app/build/outputs/apk/release/app-release-unsigned.apk
