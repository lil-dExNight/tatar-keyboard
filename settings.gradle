pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
// No build requests a Java toolchain: every build runs on the JDK that runs Gradle. A
// toolchain block would let this resolver download a JDK, which dependency verification does
// not cover, so adding one needs its own review.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
include ':app'
// Dev-only profile generator module (Macrobenchmark). Never packaged into the APK;
// its only outputs that ship are the profiles in app/src/main/generated/baselineProfiles/.
include ':baselineprofile'
