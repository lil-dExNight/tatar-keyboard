pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
include ':app'
// Dev-only profile generator module (Macrobenchmark). Never packaged into the APK;
// its only outputs that ship are the profiles in app/src/main/generated/baselineProfiles/.
include ':baselineprofile'
