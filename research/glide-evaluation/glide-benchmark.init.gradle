// Host-only compile/task wiring. Used with `gradlew -I`; does not alter the repository build
// files or package benchmark code in an APK.
allprojects { project ->
    if (project.name != 'app') return
    project.pluginManager.withPlugin('com.android.application') {
        // The bridge lives in app/src/test, so ordinary test compilation provides it without
        // putting benchmark code in an APK. The init script only registers the JavaExec replay
        // entry point against the already-compiled test classpath.
        // Register eagerly but configure lazily: AGP registers its per-variant test tasks from
        // its own afterEvaluate, which runs after this init-script callback, so testDebugUnitTest
        // is only resolvable once the task graph realizes this task.
        project.tasks.register('glideBenchmark', JavaExec) {
            group = 'verification'
            description = 'Replays normalized records through the production glide decoder.'
            def debugTest = project.tasks.named('testDebugUnitTest').get()
            dependsOn 'compileDebugUnitTestKotlin'
            classpath = debugTest.classpath + project.files(debugTest.testClassesDirs)
            mainClass = 'rkr.simplekeyboard.inputmethod.latin.glide.GlideBenchmark'
            workingDir = project.rootProject.projectDir
        }
    }
}
